<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast Colors</title>
  </head>

  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #111318;
      color: #b67130;
      font-family: sans-serif;
    }

    #initial-loader h1 {
      font-size: 2rem;
      font-weight: 900;
    }

    .loader-spinner {
      width: 32px;
      height: 32px;
      border: 4px solid #62320b;
      border-top-color: #b67130;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <body>
    <div id="root">
      <div id="initial-loader">
        <h1>FAST COLORS</h1>
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
